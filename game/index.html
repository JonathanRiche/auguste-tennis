<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Auguste Tennis</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #7ccbff; touch-action: none;
    font-family: "Baloo 2", "Nunito", "Trebuchet MS", system-ui, sans-serif; font-weight: 800; color: #fff; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; paint-order: stroke fill; text-shadow: 0 3px 0 rgba(0,0,0,.45), 0 0 10px rgba(0,0,0,.45); }
  #ui button { pointer-events: auto; font: inherit; color: #fff; border: 0; cursor: pointer;
    border-radius: 999px; background: #2b6fd6; box-shadow: 0 5px 0 rgba(0,0,0,.3); text-shadow: inherit; }
  #ui button:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.3); }
  .top { position: absolute; top: 4vh; left: 0; right: 0; text-align: center; font-size: 9vh; }
  .title { position: absolute; top: 5vh; left: 0; right: 0; text-align: center; }
  .title h1 { margin: 0; font-size: 16vh; line-height: 1; color: #d8f53c; -webkit-text-stroke: 1.2vh #1d5e2a; text-shadow: 0 1vh 0 rgba(0,0,0,.3); }
  .title h1.mid { font-size: 13vh; color: #ffd23f; -webkit-text-stroke-color: #c0392b; }
  .title .sub { font-size: 7vh; margin-top: 1vh; }
  .bottom { position: absolute; bottom: 4vh; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 1.5vh; }
  .name { font-size: 9vh; line-height: 1; }
  .row { display: flex; gap: 4vw; align-items: center; }
  .dots { display: flex; gap: 1.4vh; }
  .dots i { width: 2.2vh; height: 2.2vh; border-radius: 50%; background: rgba(255,255,255,.45); }
  .dots i.on { background: #ffd23f; }
  #ui button.go { background: #34b233; font-size: 8vh; padding: 1.5vh 7vh; }
  #ui button.go.big { font-size: 12vh; padding: 2vh 10vh; }
  #ui button.small { background: rgba(0,0,0,.35); font-size: 5vh; padding: 1.5vh 4vh; box-shadow: none; }
  #ui .row button.sel { outline: .9vh solid #ffd23f; outline-offset: .4vh; }
  #ui button.arrow { position: absolute; top: 50%; margin-top: -10vh; width: 20vh; height: 20vh; font-size: 10vh; background: #ff8a3d; }
  .arrow.left { left: max(3vw, env(safe-area-inset-left)); }
  .arrow.right { right: max(3vw, env(safe-area-inset-right)); }
  #ui button.corner { position: absolute; top: 3vh; right: max(3vw, env(safe-area-inset-right)); font-size: 5vh; padding: 1.5vh 3.5vh; background: rgba(0,0,0,.35); box-shadow: none; }
  #ui button.grownups { position: absolute; bottom: 3vh; right: max(2vw, env(safe-area-inset-right)); font-size: 3.4vh; padding: 1.2vh 2.6vh;
    background: rgba(0,0,0,.28); box-shadow: none; overflow: hidden; touch-action: none; }
  .grownups span { position: relative; display: flex; flex-direction: column; align-items: center; line-height: 1.05; }
  .grownups small { font-size: 2.4vh; opacity: .8; }
  .grownups i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #34b233; }
  .cards { position: absolute; top: 19vh; bottom: 22vh; left: 4vw; right: 4vw; display: flex; gap: 2.5vw; justify-content: center; align-items: stretch; }
  #ui button.card { flex: 1; max-width: 46vw; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1vh;
    background: rgba(20, 50, 100, .9); border: .9vh solid transparent; border-radius: 5vh; box-shadow: 0 6px 0 rgba(0,0,0,.25); padding: 2vh 1vw; }
  #ui button.card.sel { border-color: #ffd23f; background: #2b6fd6; transform: scale(1.04); }
  .card .icon { font-size: 22vh; line-height: 1.1; text-shadow: none; }
  .card .cname { font-size: 7.5vh; line-height: 1; }
  .card .blurb { font-size: 4vh; opacity: .9; }
  .card .num { font-size: 18vh; line-height: 1; color: #d8f53c; }
  .card .lname { font-size: 4.2vh; line-height: 1.05; text-align: center; min-height: 9vh; display: flex; align-items: center; }
  .stars b { font-size: 6vh; color: rgba(255,255,255,.3); text-shadow: none; }
  .stars b.on { color: #ffd23f; text-shadow: 0 3px 0 rgba(0,0,0,.35); }
  .bigstars { margin-top: 2vh; display: flex; justify-content: center; gap: 3vh; }
  .bigstars b { font-size: 22vh; line-height: 1; color: rgba(255,255,255,.3); text-shadow: none; transform: scale(.85); transition: transform .3s; }
  .bigstars b.on { color: #ffd23f; -webkit-text-stroke: .5vh #c07a00; text-shadow: 0 1vh 0 rgba(0,0,0,.3); animation: starpop .5s ease-out; transform: scale(1); }
  @keyframes starpop { from { transform: scale(2.4) rotate(-40deg); opacity: 0; } 60% { transform: scale(.9); opacity: 1; } to { transform: scale(1); } }
  .hud { position: absolute; top: 3vh; left: max(3vw, env(safe-area-inset-left)); right: 18vh; display: flex; align-items: center; gap: 3vh; }
  .balls { display: flex; flex-wrap: wrap; gap: 1.2vh; max-width: 70vw; }
  .balls i { width: 5vh; height: 5vh; border-radius: 50%; border: .6vh solid rgba(255,255,255,.8); background: rgba(0,0,0,.15); }
  .balls i.hit { background: #d8f53c; border-color: #fff; }
  .balls i.miss { background: rgba(255,255,255,.35); border-color: rgba(255,255,255,.5); }
  .balls i.now { border-color: #ffd23f; animation: blink .6s ease-in-out infinite alternate; }
  @keyframes blink { to { transform: scale(1.2); } }
  .score { font-size: 8vh; }
  .say { position: absolute; top: 24vh; left: 0; right: 0; text-align: center; font-size: 13vh; color: #ffd23f; -webkit-text-stroke: 1vh #c0392b;
    animation: say 1.3s ease-out forwards; pointer-events: none; }
  .say.big { font-size: 16vh; color: #d8f53c; -webkit-text-stroke-color: #1d5e2a; }
  .say.soft { font-size: 9vh; color: #fff; -webkit-text-stroke: 0; }
  @keyframes say { 0% { transform: scale(.3); opacity: 0; } 15% { transform: scale(1.15); opacity: 1; } 25% { transform: scale(1); } 75% { opacity: 1; } 100% { transform: translateY(-8vh); opacity: 0; } }
  .panel { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(92vw, 150vh); max-height: 96vh;
    background: rgba(20, 40, 80, .9); border-radius: 5vh; padding: 3vh 4vh; display: flex; flex-direction: column; gap: 1vh; align-items: stretch; pointer-events: auto; }
  .panel h2 { margin: 0; text-align: center; font-size: 7vh; line-height: 1; }
  .opt { display: flex; justify-content: space-between; align-items: center; font-size: 4.4vh; padding: .3vh 2.5vh; border-radius: 3vh; border: .6vh solid transparent; min-height: 8.5vh; }
  .opt.sel { border-color: #ffd23f; background: rgba(255,255,255,.12); }
  .opt b { display: flex; align-items: center; gap: 2vh; }
  .opt em { font-style: normal; min-width: 40vh; text-align: center; color: #ffd23f; }
  #ui .opt button { width: 7vh; height: 7vh; font-size: 3.5vh; box-shadow: none; }
  #ui .opt button.upd { width: auto; padding: 0 4vh; font-size: 4vh; background: #ff8a3d; }
  .status { text-align: center; font-size: 3.6vh; color: #cfe3ff; min-height: 4.5vh; }
  #ui .panel button.go { align-self: center; font-size: 6vh; margin-top: .5vh; }
  #ui button.item { font-size: 8vh; padding: 2vh; background: rgba(255,255,255,.14); box-shadow: none; border: .7vh solid transparent; }
  #ui button.item.sel { border-color: #ffd23f; background: #2b6fd6; }
  .confetti { position: absolute; inset: 0; overflow: hidden; }
  .confetti i { position: absolute; top: -6vh; width: 2.5vh; height: 4vh; border-radius: .6vh; animation: fall linear infinite; }
  @keyframes fall { to { transform: translateY(115vh) rotate(720deg); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<script src="game.js"></script>
</body>
</html>
